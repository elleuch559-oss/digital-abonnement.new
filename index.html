<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet"><title>digital-abonnement — Abonnements digitaux</title><style id="app-style">
:root{
  --bg:#EEF1F7; --surface:#FFFFFF; --ink:#172036; --muted:#59627A; --line:#D8DDEA;
  --accent:#1D5FC9; --accent-ink:#FFFFFF; --soft:#E3EAF7; --warm:#D9640F; --wa:#128C4A; --wa-ink:#FFFFFF;
  --font-d:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-b:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1322; --surface:#171E33; --ink:#EDF0F9; --muted:#A3ACC4; --line:#2A3350;
    --accent:#7DB0FF; --accent-ink:#0E1322; --soft:#1E2742; --warm:#FF9A4D;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1322; --surface:#171E33; --ink:#EDF0F9; --muted:#A3ACC4; --line:#2A3350;
  --accent:#7DB0FF; --accent-ink:#0E1322; --soft:#1E2742; --warm:#FF9A4D;
}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font-b);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.brand{font:800 22px/1 var(--font-d);letter-spacing:-.02em;text-decoration:none;display:flex;align-items:center;gap:10px}
.brand .mark{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid var(--line)}
.brand .wm{font-style:italic;font-weight:800;letter-spacing:-.03em}
.brand .wm b{color:var(--accent);font-weight:800}
.brand .wm em{color:var(--warm);font-weight:800}
.logo-panel{background:#fff;border:1px solid var(--line);border-radius:28px;padding:10px;max-width:520px;width:100%;justify-self:center;box-shadow:0 18px 50px rgba(29,95,201,.18)}
.logo-panel img{display:block;width:100%;height:auto;border-radius:20px}
.nav{display:flex;align-items:center;gap:20px}
.nav a.link{text-decoration:none;font-weight:500;color:var(--muted)}
.nav a.link:hover{color:var(--ink)}
.btn-wa{display:inline-flex;align-items:center;gap:8px;background:var(--wa);color:var(--wa-ink);text-decoration:none;font-weight:600;padding:10px 16px;border-radius:12px;border:0;cursor:pointer}
.btn-wa:hover{filter:brightness(1.08)}
.btn-wa svg{width:18px;height:18px;fill:currentColor}
@media (max-width:640px){.nav a.link{display:none}}

/* hero */
.hero{padding:56px 0 40px}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.hero h1{font:800 clamp(34px,5.2vw,58px)/1.02 var(--font-d);letter-spacing:-.03em;margin:0 0 18px}
.hero p.lead{font-size:18px;color:var(--muted);max-width:52ch;margin:0 0 28px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn-main{background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;padding:13px 22px;border-radius:12px}
.btn-main:hover{filter:brightness(1.1)}
.btn-ghost{border:1.5px solid var(--line);background:var(--surface);text-decoration:none;font-weight:600;padding:13px 22px;border-radius:12px}
.btn-ghost:hover{border-color:var(--ink)}
.mosaic{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mosaic .tile{aspect-ratio:1;border-radius:20px}
.mosaic .tile:nth-child(3n+2){transform:translateY(22px)}
.mosaic .tile .icon{width:52%;height:52%;border-radius:22%;font-size:clamp(16px,3vw,26px)}
.mosaic .tile{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.mosaic .tile:nth-child(1){animation-delay:.02s}.mosaic .tile:nth-child(2){animation-delay:.08s}.mosaic .tile:nth-child(3){animation-delay:.14s}
.mosaic .tile:nth-child(4){animation-delay:.2s}.mosaic .tile:nth-child(5){animation-delay:.26s}.mosaic .tile:nth-child(6){animation-delay:.32s}
.mosaic .tile:nth-child(7){animation-delay:.38s}.mosaic .tile:nth-child(8){animation-delay:.44s}.mosaic .tile:nth-child(9){animation-delay:.5s}
@keyframes rise{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}
@media (prefers-reduced-motion:reduce){.mosaic .tile{animation:none}html{scroll-behavior:auto}}
.points{display:flex;flex-wrap:wrap;gap:10px 28px;margin:34px 0 0;padding:0;list-style:none;color:var(--muted);font-size:15px}
.points li{display:flex;align-items:center;gap:8px}
.points svg{width:18px;height:18px;flex:none;stroke:var(--accent);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;gap:36px}.hero{padding-top:36px}.mosaic{max-width:420px}}

/* catalogue */
section.block{padding:48px 0}
h2.title{font:800 clamp(26px,3.4vw,38px)/1.1 var(--font-d);letter-spacing:-.025em;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 24px;max-width:60ch}
.toolbar{display:flex;flex-direction:column;gap:14px;margin-bottom:18px}
.search{position:relative;max-width:420px}
.search input{width:100%;padding:12px 14px 12px 42px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-weight:500;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--muted);font-size:14px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:12px}
.tile{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2));display:grid;place-items:center}
.tile::before{content:"";position:absolute;right:-18%;top:-30%;width:70%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.14)}
.tile::after{content:"";position:absolute;left:-12%;bottom:-38%;width:55%;aspect-ratio:1;border-radius:50%;background:rgba(0,0,0,.14)}
.icon{position:relative;z-index:1;width:70px;height:70px;border-radius:20px;background:rgba(255,255,255,.97);display:grid;place-items:center;font:800 27px/1 var(--font-d);letter-spacing:-.03em;color:var(--c1);box-shadow:0 10px 24px rgba(0,0,0,.22)}
.icon.logo{width:138px;height:138px;margin-top:10px;background:none;border-radius:26%;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.28)}
.icon.logo img{width:100%;height:100%;display:block}
.icon.logo.wide{width:190px;height:auto;background:#fff;padding:14px 18px;border-radius:18px}
.icon.logo.wide img{height:auto}
.dur{position:absolute;left:10px;top:10px;z-index:2;background:rgba(0,0,0,.4);color:#fff;font:600 12px var(--font-b);padding:4px 9px;border-radius:999px}
.tag{position:absolute;right:10px;top:10px;z-index:2;background:#fff;color:#14305E;font:700 12px var(--font-b);padding:4px 9px;border-radius:999px}
.info{padding:0 4px;display:flex;flex-direction:column;gap:4px}
.card h3{font:700 19px/1.15 var(--font-d);letter-spacing:-.01em;margin:0}
.plan{color:var(--accent);font-weight:600;font-size:14px}
.desc{color:var(--muted);font-size:14px;line-height:1.45;margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.buy{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 4px}
.price{font:800 24px/1 var(--font-d);letter-spacing:-.02em}
.price small{font:600 13px var(--font-b);color:var(--muted);letter-spacing:0;margin-left:3px}
.btn-add{border:1.5px solid var(--accent);color:var(--accent);background:transparent;padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer}
.btn-add:hover{background:var(--accent);color:var(--accent-ink)}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--accent);border-radius:10px;overflow:hidden}
.step button{width:36px;height:36px;border:0;background:transparent;color:var(--accent);font-size:20px;line-height:1;cursor:pointer}
.step button:hover{background:var(--soft)}
.step span{min-width:28px;text-align:center;font-weight:700}
.group{margin-bottom:40px}
.gh{display:flex;align-items:baseline;gap:12px;margin:0 0 16px;padding-bottom:10px;border-bottom:2px solid var(--line);font:800 clamp(22px,2.6vw,28px)/1.1 var(--font-d);letter-spacing:-.02em}
.gh span{font:600 14px var(--font-b);letter-spacing:0;color:var(--muted)}
.empty{padding:40px 0;color:var(--muted)}
.empty a{color:var(--accent);font-weight:600}

/* paiement */
.pay-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.paycard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.paycard .logo{height:44px;display:flex}
.paycard h3{margin:0;font:700 18px var(--font-d)}
.paycard p{margin:0;color:var(--muted);font-size:14px}
.paycard .detail{margin-top:auto;font-weight:600;font-size:15px;background:var(--soft);padding:9px 12px;border-radius:10px}
.logo svg{height:100%;width:auto;display:block;border-radius:10px}
.steps{list-style:none;padding:0;margin:36px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 16px var(--font-d)}
.steps b{display:block;font-family:var(--font-d);font-size:17px}
.steps span{color:var(--muted);font-size:14px}

footer{border-top:1px solid var(--line);padding:32px 0 120px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px}
footer b{color:var(--ink)}

/* barre de commande */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:var(--bg);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;transform:translateY(115%);transition:transform .25s ease}
.bar.on{transform:none}
.bar .sum{font-weight:600}
.bar .sum small{display:block;font-weight:400;opacity:.75}
@media (prefers-reduced-motion:reduce){.bar{transition:none}}

/* panneau commande */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,15,30,.6);display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.sheet{background:var(--surface);width:min(580px,100%);max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px;max-height:88%}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet h2{margin:0;font:800 24px var(--font-d);letter-spacing:-.02em}
.x{border:0;background:var(--soft);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px}
.line{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line .nm b{font-family:var(--font-d)}
.line .nm span{display:block;color:var(--muted);font-size:13px}
.line .lp{font-weight:700;min-width:64px;text-align:right}
.total{display:flex;justify-content:space-between;font:800 20px var(--font-d);padding:14px 0}
fieldset{border:0;padding:0;margin:6px 0 0}
legend{font-weight:700;margin-bottom:10px;padding:0}
.payopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.payopt{position:relative;border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.payopt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.payopt:has(input:checked){border-color:var(--accent);background:var(--soft)}
.payopt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.payopt .logo{height:30px}
.payopt span{font-size:13px;font-weight:600}
.pdetail{margin:12px 0;background:var(--soft);padding:12px 14px;border-radius:12px;font-size:14px}
.pdetail b{display:block;margin-top:4px}
.field{display:block;margin:12px 0}
.field span{display:block;font-weight:600;margin-bottom:6px;font-size:14px}
.field input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.send{display:flex;justify-content:center;align-items:center;gap:10px;width:100%;background:var(--wa);color:var(--wa-ink);text-decoration:none;font-weight:700;padding:15px;border-radius:14px;font-size:16px}
.send:hover{filter:brightness(1.08)}
.send svg{width:20px;height:20px;fill:currentColor}
.hint{color:var(--muted);font-size:13px;margin:10px 0 0;text-align:center}

.pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.logo img{height:100%;width:auto;display:block;border-radius:10px}
.btn-add:disabled{opacity:.5;border-color:var(--line);color:var(--muted);cursor:not-allowed;background:transparent}
#admBtn{border:1.5px dashed var(--warm);background:transparent;color:var(--warm);font:700 13px var(--font-b);padding:8px 12px;border-radius:10px;cursor:pointer}
.adm{position:fixed;inset:0;z-index:60;background:rgba(10,15,30,.6);display:none;justify-content:flex-start;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:15px}
.adm.on{display:flex}
.adm-box{background:var(--surface);color:var(--ink);width:min(580px,100%);height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.adm-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-size:19px}
.adm-head button{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;cursor:pointer;color:var(--ink)}
.adm-tabs{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line)}
.adm-tabs button{flex:1;border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:9px;border-radius:10px;font:700 14px inherit;cursor:pointer}
.adm-tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.adm-body{flex:1;overflow:auto;padding:14px 16px}
.adm-body h3{margin:6px 0 4px;font-size:20px}
.adm-body h4{margin:18px 0 4px;font-size:16px}.adm-body h4 small{color:var(--muted);font-weight:400}
.adm-hint{background:var(--soft);padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}
.adm-foot{display:flex;align-items:center;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.adm-foot span{flex:1;font-size:13px;color:var(--muted)}
.primary{background:var(--wa);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:700 14px inherit;cursor:pointer}
.primary:disabled{opacity:.6}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font:600 13px inherit;cursor:pointer}
.adm-bar{display:flex;gap:8px;margin-bottom:6px}
.adm-bar input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.adm-row{display:grid;grid-template-columns:56px 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.adm-row.off{opacity:.55}
.adm-th{width:56px;height:42px;border-radius:8px;background:linear-gradient(135deg,var(--c1),var(--c2));display:grid;place-items:center;color:#fff;font:700 13px system-ui;overflow:hidden}
.adm-th img{width:100%;height:100%;object-fit:cover}
.adm-nm b{display:block}.adm-nm span{color:var(--muted);font-size:13px}
.fl{font-style:normal;background:var(--soft);border-radius:6px;padding:1px 6px;font-size:12px;margin-inline-start:6px}
.adm-pr{font-weight:700;direction:ltr}
.adm-ac{grid-column:1/-1;display:flex;gap:6px}
.adm-ac button,.adm-back,.adm-clr{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:5px 11px;cursor:pointer;font:600 13px inherit}
.adm-ac .danger{color:#C62828;border-color:#C62828}
.adm-back{margin-bottom:6px}
.adm-f{display:block;margin:12px 0}.adm-f>span{display:block;font-weight:700;font-size:13px;margin-bottom:5px}
.adm-f input:not([type=checkbox]):not([type=color]):not([type=file]),.adm-f select,.adm-f textarea{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.adm-f textarea{min-height:84px}
.adm-f input[type=color]{width:100%;height:42px;padding:2px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}
.adm-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.adm-chk{display:flex;gap:8px;align-items:center;margin:12px 0;font-weight:600}
.adm-card{border:1px solid var(--line);border-radius:14px;padding:4px 12px 12px;margin-bottom:14px}
.adm-up{display:inline-block;border:1.5px solid var(--accent);color:var(--accent);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:13px}
.adm-up input{display:none}
.adm-prev{margin-bottom:8px;max-width:200px}.adm-prev .adm-th{width:140px;height:100px}.adm-prev>img{max-width:100%;max-height:120px;border-radius:10px;background:#fff}
.adm-logo{height:40px;margin-bottom:8px}
.adm-empty{color:var(--muted)}
</style></head><body><template id="shell">
<header class="top">
  <div class="wrap">

        WhatsApp
      </a>

  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <div>
        <h1 id="hTitle"></h1>
        <p class="lead" id="hLead"></p>
        <div class="cta">
          <a class="btn-main" href="#catalogue">Voir les abonnements</a>
          <a class="btn-ghost" id="waHero" href="#" target="_blank" rel="noopener">Poser une question</a>
        </div>

const DATA=JSON.parse(document.getElementById("site-data").textContent);
let STORE=DATA.settings, PAYMENTS=DATA.payments, PRODUCTS=DATA.products, LOGOS=DATA.logos;
const GROUP_TITLES={ia:"Intelligence artificielle (IA)",design:"Design et productivité",stream:"Streaming vidéo",music:"Musique",learn:"Apprentissage",vpn:"VPN et sécurité",game:"Gaming"};
const CATS=[["all","Tous"],["ia","IA"],["design","Design & productivité"],["stream","Streaming"],["music","Musique"],["learn","Apprentissage"],["vpn","VPN"],["game","Gaming"]];

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const vis=()=>PRODUCTS.filter(p=>!p.hidden);
const PAYS=()=>PAYMENTS.filter(m=>m.enabled!==false);
const pdHTML=m=>esc(m.how)+(m.detail?`<b>${esc(m.detail)}</b>`:"");
{const sh=document.getElementById("shell");sh.parentNode.insertBefore(sh.content.cloneNode(true),sh)}



const $=s=>document.querySelector(s);
const money=n=>n+" "+STORE.currency;
let byId={};
const cart={};
let cat="all", query="", pay="d17", custName="", sheetOpen=false;

/* Logos des moyens de paiement (à remplacer par les logos officiels si vous les avez) */
function logo(id){
  const pm=PAYMENTS.find(x=>x.id===id); if(pm&&pm.img) return `<img src="${pm.img}" alt="${esc(pm.name)}">`;
  const w=(bg,inner)=>`<svg viewBox="0 0 150 48" role="img" aria-label="${id}"><rect width="150" height="48" rx="10" fill="${bg}"/>${inner}</svg>`;
  if(id==="d17") return w("#FFC72C",`<text x="75" y="33" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="26" fill="#0B3D91">D17</text>`);
  if(id==="flouci") return `<svg viewBox="0 0 150 48" role="img" aria-label="Flouci"><defs><linearGradient id="gf" x1="0" x2="1"><stop offset="0" stop-color="#00C2A8"/><stop offset="1" stop-color="#2A7BFF"/></linearGradient></defs><rect width="150" height="48" rx="10" fill="url(#gf)"/><text x="75" y="32" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="24" fill="#fff">flouci</text></svg>`;
  if(id==="izi") return w("#E4007C",`<text x="75" y="34" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="28" fill="#fff">izi</text>`);
  return w("#14305E",`<g fill="#fff"><path d="M30 17l12-7 12 7v2H30z"/><rect x="32" y="21" width="3" height="11"/><rect x="39" y="21" width="3" height="11"/><rect x="46" y="21" width="3" height="11"/><rect x="50" y="21" width="3" height="11"/><rect x="29" y="34" width="26" height="3"/></g><text x="62" y="23" font-family="Arial,sans-serif" font-weight="700" font-size="13" fill="#fff">Virement</text><text x="62" y="37" font-family="Arial,sans-serif" font-weight="700" font-size="13" fill="#fff">bancaire</text>`);
}

const WIDE_LOGOS={claude:true};
function iconHTML(p){
  if(p.img) return `<img class="pimg" alt="" src="${esc(p.img)}">`;
  if(p.mark[0]==="@"){const k=p.mark.slice(1);return `<div class="icon logo${WIDE_LOGOS[k]?" wide":""}"><img alt="" src="${LOGOS[k]}"></div>`}
  return `<div class="icon">${esc(p.mark)}</div>`;
}
const tileHTML=(p,badge)=>`<div class="tile" style="--c1:${p.c1};--c2:${p.c2}">${badge?`<span class="dur">${esc(p.plan.split("·").pop().trim())}</span>`:""}${badge&&p.tag?`<span class="tag">${esc(p.tag)}</span>`:""}${iconHTML(p)}</div>`;

function actions(p){
  const q=cart[p.id]||0;
  if(p.soldOut) return `<button class="btn-add" type="button" disabled>Épuisé</button>`;
  if(!q) return `<button class="btn-add" type="button" data-act="add" data-id="${p.id}" aria-label="Ajouter ${esc(p.brand)} ${esc(p.plan)} à la commande">Ajouter</button>`;
  return stepper(p.id,q);
}
function stepper(id,q){
  return `<div class="step"><button type="button" data-act="dec" data-id="${id}" aria-label="Retirer un">−</button><span>${q}</span><button type="button" data-act="inc" data-id="${id}" aria-label="Ajouter un">+</button></div>`;
}

function cardHTML(p){
  return `<article class="card">${tileHTML(p,true)}
    <div class="info"><h3>${esc(p.brand)}</h3><span class="plan">${esc(p.plan)}</span><p class="desc">${esc(p.desc)}</p></div>
    <div class="buy"><div class="price">${p.price}<small>${STORE.currency}</small></div><div class="acts" data-id="${p.id}">${actions(p)}</div></div>
  </article>`;
}

function renderGrid(){
  const q=query.trim().toLowerCase();
  const list=vis().filter(p=>(cat==="all"||p.cat===cat)&&(!q||(p.brand+" "+p.plan+" "+p.desc).toLowerCase().includes(q)));
  $("#count").textContent=list.length+(list.length>1?" abonnements":" abonnement");
  $("#grid").innerHTML=CATS.filter(c=>c[0]!=="all").map(([id])=>[id,list.filter(p=>p.cat===id)]).filter(g=>g[1].length).map(([id,items])=>
    `<section class="group" id="cat-${id}"><h3 class="gh">${GROUP_TITLES[id]}<span>${items.length} ${items.length>1?"offres":"offre"}</span></h3><div class="grid">${items.map(cardHTML).join("")}</div></section>`).join("");
  if(!list.length){
    $("#grid").innerHTML=`<div class="empty">Aucun abonnement trouvé. Essayez un autre mot, ou <a href="${waLink("Bonjour, je cherche un abonnement : "+query)}" target="_blank" rel="noopener">demandez-le-nous sur WhatsApp</a>.</div>`;
  }
}
function renderChips(){
  $("#chips").innerHTML=CATS.map(([id,label])=>{
    const n=id==="all"?vis().length:vis().filter(p=>p.cat===id).length;
    return `<button class="chip" type="button" data-cat="${id}" aria-pressed="${cat===id}">${label} (${n})</button>`;
  }).join("");
}

function waLink(text){return "https://wa.me/"+STORE.whatsapp+"?text="+encodeURIComponent(text)}
function totals(){let n=0,t=0;for(const id in cart){n+=cart[id];t+=cart[id]*byId[id].price}return{n,t}}

function orderMessage(){
  const lines=["Bonjour "+STORE.name+", je souhaite commander :"];
  for(const id in cart){const p=byId[id];lines.push("• "+p.brand+" "+p.plan+" ×"+cart[id]+" — "+money(p.price*cart[id]))}
  lines.push("","Total : "+money(totals().t));
  lines.push("Paiement : "+PAYMENTS.find(m=>m.id===pay).name);
  if(custName.trim()) lines.push("Nom : "+custName.trim());
  return lines.join("\n");
}

function refreshBar(){
  const {n,t}=totals();
  $("#bar").classList.toggle("on",n>0);
  $("#barCount").textContent=n+(n>1?" abonnements":" abonnement");
  $("#barTotal").textContent="Total : "+money(t);
}

function renderSheet(){
  const {t}=totals();
  const m=PAYMENTS.find(x=>x.id===pay);
  const lines=Object.keys(cart).map(id=>{const p=byId[id];
    return `<div class="line"><div class="nm"><b>${esc(p.brand)}</b><span>${esc(p.plan)}</span></div>${stepper(id,cart[id])}<div class="lp">${money(p.price*cart[id])}</div></div>`}).join("");
  $("#sheet").innerHTML=`
    <div class="sheet-head"><h2 id="sheetTitle">Votre commande</h2><button class="x" type="button" data-act="close" aria-label="Fermer">✕</button></div>
    <div>${lines}</div>
    <div class="total"><span>Total</span><span>${money(t)}</span></div>
    <fieldset><legend>Mode de paiement</legend><div class="payopts">
      ${PAYS().map(x=>`<label class="payopt"><input type="radio" name="pay" value="${x.id}" ${x.id===pay?"checked":""}><div class="logo">${logo(x.id)}</div><span>${esc(x.name)}</span></label>`).join("")}
    </div></fieldset>
    <div class="pdetail" id="pdetail">${pdHTML(m)}</div>
    <label class="field"><span>Votre prénom (facultatif)</span><input id="cname" type="text" autocomplete="given-name" value="${custName.replace(/"/g,"&quot;")}"></label>
    <a class="send" id="send" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2a9.9 9.9 0 0 0-8.5 14.96L2 22l5.2-1.5A9.9 9.9 0 1 0 12.04 2Zm5.8 14.1c-.25.7-1.45 1.33-2 1.4-.52.07-1.17.1-1.9-.12a17 17 0 0 1-1.73-.64c-3.04-1.3-5.02-4.36-5.17-4.56-.15-.2-1.24-1.65-1.24-3.15 0-1.5.78-2.23 1.06-2.54.28-.3.6-.38.8-.38l.58.01c.19.01.44-.07.68.52.25.6.85 2.07.93 2.22.07.15.12.33.02.52-.1.2-.15.32-.3.5-.15.17-.31.38-.44.51-.15.15-.3.31-.13.6.17.3.77 1.27 1.65 2.06 1.13 1 2.09 1.32 2.39 1.47.3.15.47.12.65-.07.17-.2.75-.87.95-1.17.2-.3.4-.25.67-.15.28.1 1.75.83 2.05.98.3.15.5.22.57.35.08.12.08.72-.17 1.42Z"/></svg>Envoyer la commande sur WhatsApp</a>
    <p class="hint">Vous recevez les détails de paiement et d'activation dans la conversation.</p>`;
  updateSend();
}
function updateSend(){
  const s=$("#send"); if(s) s.href=waLink(orderMessage());
}

function openSheet(){sheetOpen=true;renderSheet();$("#scrim").classList.add("on");$("#sheet .x").focus()}
function closeSheet(){sheetOpen=false;$("#scrim").classList.remove("on");$("#openSheet").focus()}

function change(id,d,fromSheet){
  cart[id]=(cart[id]||0)+d;
  if(cart[id]<=0) delete cart[id];
  const act=d>0?"inc":"dec";
  const holder=document.querySelector(`.acts[data-id="${id}"]`);
  if(holder){holder.innerHTML=actions(byId[id])}
  refreshBar();
  if(sheetOpen){
    if(!totals().n){closeSheet();return}
    renderSheet();
  }
  const root=fromSheet?$("#sheet"):document;
  const target=root.querySelector(`[data-act="${act}"][data-id="${id}"]`)||root.querySelector(`[data-id="${id}"] [data-act]`)||root.querySelector(`[data-act][data-id="${id}"]`);
  if(target) target.focus();
}

document.addEventListener("click",e=>{
  const c=e.target.closest("[data-cat]");
  if(c){cat=c.dataset.cat;renderChips();renderGrid();return}
  const b=e.target.closest("[data-act]");
  if(b){
    const a=b.dataset.act, id=b.dataset.id, fromSheet=!!b.closest("#sheet");
    if(a==="add"||a==="inc") change(id,1,fromSheet);
    else if(a==="dec") change(id,-1,fromSheet);
    else if(a==="close") closeSheet();
    return;
  }
  if(e.target===$("#scrim")) closeSheet();
});
document.addEventListener("change",e=>{
  if(e.target.name==="pay"){
    pay=e.target.value;
    const m=PAYMENTS.find(x=>x.id===pay);
    $("#pdetail").innerHTML=pdHTML(m);
    updateSend();
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="cname"){custName=e.target.value;updateSend()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheetOpen)closeSheet()});
$("#q").addEventListener("input",e=>{query=e.target.value;renderGrid()});
$("#openSheet").addEventListener("click",openSheet);


function reindex(){
  byId=Object.fromEntries(PRODUCTS.map(p=>[p.id,p]));
  for(const id in cart) if(!byId[id]) delete cart[id];
  if(!PAYS().some(m=>m.id===pay)) pay=(PAYS()[0]||{}).id||"";
}
function renderPayGrid(){
  $("#payGrid").innerHTML=PAYS().map(m=>`<div class="paycard"><div class="logo">${logo(m.id)}</div><h3>${esc(m.name)}</h3><p>${esc(m.how)}</p>${m.detail?`<div class="detail">${esc(m.detail)}</div>`:""}</div>`).join("");
}
function applySettings(){
  const s=STORE, parts=s.name.split("-");
  document.title=s.name+" — Abonnements digitaux";
  $("#brandWm").innerHTML=parts.length>1?`<b>${esc(parts[0])}-</b><em>${esc(parts.slice(1).join("-"))}</em>`:`<b>${esc(s.name)}</b>`;
  $("#brandIcon").src=s.logoIcon||""; $("#logoFull").src=s.logoFull||""; $("#logoFull").alt=s.name;
  $("#hTitle").textContent=s.heroTitle; $("#hLead").textContent=s.heroLead.replace("{n}",vis().length);
  $("#cTitle").textContent=s.catTitle; $("#cSub").textContent=s.catSub;
  $("#pTitle").textContent=s.payTitle; $("#pSub").textContent=s.paySub; $("#fNote").textContent=s.footerNote;
  $("#storeName2").textContent=s.name; $("#waText").textContent=s.whatsappLabel;
  const hello=waLink("Bonjour "+s.name+", j'ai une question sur vos abonnements.");
  $("#waTop").href=hello; $("#waHero").href=hello;
}
function refresh(){reindex();applySettings();renderPayGrid();renderChips();renderGrid();refreshBar();if(sheetOpen)renderSheet()}
refresh();

/* ===== ADMINISTRATION (visible seulement pour les éditeurs de l'artefact) ===== */
let ART=null, dirty=false; const A={tab:"offers",edit:null,q:""};
const HEAD='<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">';
function buildDoc(){
  const d=JSON.stringify(DATA).replace(/</g,"\\u003c");
  return "<!doctype html>\n<html lang=\"fr\"><head>"+HEAD+"<title>"+esc(STORE.name)+" — Abonnements digitaux</title><style id=\"app-style\">"+$("#app-style").textContent+"</style></head><body><template id=\"shell\">"+$("#shell").innerHTML+"</template><script type=\"application/json\" id=\"site-data\">"+d+"<\/script><script id=\"app-script\">"+$("#app-script").textContent+"<\/script></body></html>";
}
const CATAR={ia:"الذكاء الاصطناعي",design:"التصميم والإنتاجية",stream:"البث المرئي",music:"الموسيقى",learn:"التعلّم",vpn:"VPN",game:"الألعاب"};
const touch=()=>{dirty=true;status("هناك تغييرات غير منشورة")};
const status=t=>{const e=$("#admStatus");if(e)e.textContent=t};
const nid=()=>"p"+Date.now().toString(36)+Math.floor(Math.random()*99);

function thumb(p){
  const inner=p.img?`<img src="${esc(p.img)}" alt="">`:p.mark[0]==="@"&&LOGOS[p.mark.slice(1)]?`<img src="${LOGOS[p.mark.slice(1)]}" alt="">`:esc(p.mark);
  return `<div class="adm-th" style="--c1:${esc(p.c1)};--c2:${esc(p.c2)}">${inner}</div>`;
}
function rowHTML(p){
  const fl=(p.hidden?'<em class="fl">مخفي</em>':"")+(p.soldOut?'<em class="fl">نفد</em>':"");
  return `<div class="adm-row${p.hidden?" off":""}">${thumb(p)}<div class="adm-nm"><b>${esc(p.brand)}</b><span>${esc(p.plan)}</span>${fl}</div><div class="adm-pr">${esc(p.price)} ${esc(STORE.currency)}</div><div class="adm-ac"><button type="button" data-a="edit" data-id="${p.id}">تعديل</button><button type="button" data-a="dup" data-id="${p.id}">نسخ</button><button type="button" class="danger" data-a="del" data-id="${p.id}">حذف</button></div></div>`;
}
function listBody(){
  const q=A.q.trim().toLowerCase(), rows=PRODUCTS.filter(p=>!q||(p.brand+" "+p.plan).toLowerCase().includes(q));
  const h=Object.keys(CATAR).map(c=>{const r=rows.filter(p=>p.cat===c);return r.length?`<h4>${CATAR[c]} <small>${r.length}</small></h4>`+r.map(rowHTML).join(""):""}).join("");
  return h||'<p class="adm-empty">لا توجد نتائج.</p>';
}
const F=(label,inner)=>`<label class="adm-f"><span>${label}</span>${inner}</label>`;
const TI=(o,v,x)=>`<input data-o="${o}" value="${esc(v)}" dir="auto" ${x||""}>`;
const TA=(o,v)=>`<textarea data-o="${o}" dir="auto">${esc(v)}</textarea>`;
const UP=(t,max,has)=>`<label class="adm-up"><input type="file" accept="image/*" data-up="${t}" data-max="${max}">رفع صورة</label>${has?` <button type="button" class="adm-clr" data-a="clr" data-t="${t}">حذف الصورة</button>`:""}`;

function formHTML(p){
  const sel=`<select data-o="p.cat">${Object.keys(CATAR).map(c=>`<option value="${c}"${p.cat===c?" selected":""}>${CATAR[c]}</option>`).join("")}</select>`;
  return `<button type="button" class="adm-back" data-a="back">→ رجوع إلى القائمة</button>
  ${F("الفئة",sel)}${F("الاسم (مثال: ChatGPT personnel)",TI("p.brand",p.brand))}${F("العرض والمدة (مثال: Plus · 1 mois)",TI("p.plan",p.plan))}
  ${F("السعر ("+esc(STORE.currency)+")",`<input type="number" min="0" step="1" data-o="p.price" value="${esc(p.price)}" dir="ltr">`)}
  ${F("الوصف (بالفرنسية، يظهر للحريف)",TA("p.desc",p.desc))}${F("الشارة (اختياري، مثال: Compte personnel)",TI("p.tag",p.tag||""))}
  <div class="adm-2">${F("اللون الأول",`<input type="color" data-o="p.c1" value="${esc(p.c1)}">`)}${F("اللون الثاني",`<input type="color" data-o="p.c2" value="${esc(p.c2)}">`)}</div>
  ${F("الرمز على الصورة (حرفان أو ثلاثة)",TI("p.mark",p.mark[0]==="@"?"":p.mark,'maxlength="4"'))}
  <div class="adm-f"><span>صورة المنتج (اختياري)</span><div class="adm-prev">${thumb(p)}</div>${UP("p.img",520,!!p.img)}</div>
  <label class="adm-chk"><input type="checkbox" data-o="p.hidden"${p.hidden?" checked":""}> إخفاء هذا العرض من الموقع</label>
  <label class="adm-chk"><input type="checkbox" data-o="p.soldOut"${p.soldOut?" checked":""}> نفد المخزون (يظهر «Épuisé»)</label>`;
}
function payHTML(){
  return PAYMENTS.map((m,i)=>`<div class="adm-card"><h4>${esc(m.name)}</h4>
    <label class="adm-chk"><input type="checkbox" data-o="m.enabled.${i}"${m.enabled!==false?" checked":""}> مفعّل (يظهر في الموقع)</label>
    ${F("الاسم",TI("m.name."+i,m.name))}${F("طريقة الدفع (النص الذي يراه الحريف)",TA("m.how."+i,m.how))}
    ${F("الرقم أو الـ RIB (اختياري، يظهر للحريف)",TI("m.detail."+i,m.detail||"",'dir="ltr"'))}
    <div class="adm-f"><span>الشعار</span><div class="logo adm-logo">${logo(m.id)}</div>${UP("m.img."+i,300,!!m.img)}</div></div>`).join("");
}
function siteHTML(){
  const s=STORE,T=(k,l,x)=>F(l,TI("s."+k,s[k],x||""));
  const im=(k,l,max)=>`<div class="adm-f"><span>${l}</span><div class="adm-prev">${s[k]?`<img src="${esc(s[k])}" alt="">`:""}</div>${UP("s."+k,max,false)}</div>`;
  return T("name","اسم المتجر")+T("whatsapp","رقم واتساب (بالصيغة الدولية بدون +، مثال 21625103206)",'dir="ltr" inputmode="numeric"')+T("whatsappLabel","رقم واتساب للعرض (مثال +216 25 103 206)",'dir="ltr"')+T("currency","العملة")
   +F("عنوان الصفحة الرئيسية",TA("s.heroTitle",s.heroTitle))+F("نص الصفحة الرئيسية (استعمل {n} لعدد العروض)",TA("s.heroLead",s.heroLead))
   +T("catTitle","عنوان قسم العروض")+F("نص قسم العروض",TA("s.catSub",s.catSub))+T("payTitle","عنوان قسم الدفع")+F("نص قسم الدفع",TA("s.paySub",s.paySub))
   +F("ملاحظة أسفل الصفحة",TA("s.footerNote",s.footerNote))+im("logoFull","الشعار الكامل",900)+im("logoIcon","أيقونة الشعار (دائرية صغيرة)",160);
}
function renderAdmin(){
  document.querySelectorAll("#adm [data-tab]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===A.tab)));
  const body=$("#admBody"), keep=body.scrollTop;
  if(A.tab==="offers"){
    const p=A.edit&&byId[A.edit];
    body.innerHTML=p?`<h3>${esc(p.brand)}</h3>`+formHTML(p):`<div class="adm-hint">التغييرات تظهر هنا مباشرة، ولا تُنشر للزبائن إلا عند الضغط على «نشر التغييرات».</div><div class="adm-bar"><input id="admQ" type="search" placeholder="ابحث عن عرض…" value="${esc(A.q)}" dir="auto"><button type="button" class="primary" data-a="new">+ إضافة عرض</button></div><div id="admList">${listBody()}</div>`;
  } else body.innerHTML=`<div class="adm-hint">التغييرات تظهر هنا مباشرة، ولا تُنشر للزبائن إلا عند الضغط على «نشر التغييرات».</div>`+(A.tab==="pay"?payHTML():siteHTML());
  body.scrollTop=keep;
}
function setPath(path,v){
  const [sc,k,i]=path.split(".");
  if(sc==="p"){const p=byId[A.edit]; if(p){ if(v===""&&(k==="tag"||k==="img")) delete p[k]; else p[k]=v }}
  else if(sc==="m"){PAYMENTS[Number(i)][k]=v}
  else if(sc==="s"){STORE[k]=v}
}
function readImg(file,max,done){
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext("2d").drawImage(im,0,0,c.width,c.height);done(c.toDataURL(file.type==="image/png"?"image/png":"image/jpeg",.86))};im.onerror=()=>status("تعذّر قراءة الصورة");im.src=fr.result};
  fr.readAsDataURL(file);
}
function onField(e){
  const t=e.target;
  if(t.id==="admQ"){A.q=t.value;$("#admList").innerHTML=listBody();return}
  if(t.dataset.up){ if(t.files&&t.files[0]) readImg(t.files[0],Number(t.dataset.max)||480,u=>{setPath(t.dataset.up,u);touch();refresh();renderAdmin()}); return }
  const o=t.dataset.o; if(!o) return;
  let v=t.type==="checkbox"?t.checked:t.type==="number"?(Number(t.value)||0):t.value;
  if(o==="p.mark"&&byId[A.edit]&&byId[A.edit].mark[0]==="@"&&v==="") return;
  setPath(o,v); touch(); refresh();
}
async function publishNow(){
  const b=$("#admPub"); b.disabled=true; status("جارٍ النشر…");
  try{ await ART.publish(buildDoc()); dirty=false; status("تم النشر ✓"); b.disabled=false }
  catch(e){ b.disabled=false; const c=e&&e.code; status(c==="not_writer"||c==="not_granted"?"ليست لديك صلاحية النشر.":c==="rate_limited"?"محاولات كثيرة، انتظر قليلا ثم أعد المحاولة.":"تعذّر النشر، أعد المحاولة.") }
}
function onAdminClick(e){
  const tb=e.target.closest("[data-tab]"); if(tb){A.tab=tb.dataset.tab;A.edit=null;renderAdmin();return}
  const b=e.target.closest("[data-a]"); if(!b) return;
  const a=b.dataset.a, id=b.dataset.id, i=PRODUCTS.findIndex(p=>p.id===id);
  if(a==="close") $("#adm").classList.remove("on");
  else if(a==="publish") publishNow();
  else if(a==="discard"){ if(!dirty||confirm("إلغاء كل التغييرات غير المنشورة؟")) location.reload() }
  else if(a==="back"){A.edit=null;renderAdmin()}
  else if(a==="edit"){A.edit=id;renderAdmin();$("#admBody").scrollTop=0}
  else if(a==="new"){const n=nid();PRODUCTS.push({id:n,cat:"ia",brand:"Nouvelle offre",plan:"1 mois",price:0,desc:"",c1:"#1D5FC9",c2:"#0B2F6B",mark:"Ab"});A.edit=n;touch();refresh();renderAdmin()}
  else if(a==="dup"&&i>-1){const c=Object.assign({},PRODUCTS[i],{id:nid()});PRODUCTS.splice(i+1,0,c);A.edit=c.id;touch();refresh();renderAdmin()}
  else if(a==="del"&&i>-1){ if(confirm("حذف هذا العرض نهائيا؟")){PRODUCTS.splice(i,1);touch();refresh();renderAdmin()} }
  else if(a==="clr"){setPath(b.dataset.t,"");touch();refresh();renderAdmin()}
}
function mountAdmin(){
  const btn=document.createElement("button"); btn.id="admBtn"; btn.type="button"; btn.textContent="⚙ الإدارة";
  btn.onclick=()=>{$("#adm").classList.add("on");renderAdmin()};
  $(".nav").prepend(btn);
  const p=document.createElement("div"); p.id="adm"; p.className="adm"; p.dir="rtl"; p.lang="ar";
  p.innerHTML='<div class="adm-box" role="dialog" aria-modal="true" aria-label="لوحة الإدارة"><div class="adm-head"><b>لوحة الإدارة</b><button type="button" data-a="close" aria-label="إغلاق">✕</button></div><div class="adm-tabs" role="tablist"><button type="button" role="tab" data-tab="offers">العروض</button><button type="button" role="tab" data-tab="pay">طرق الدفع</button><button type="button" role="tab" data-tab="site">الموقع</button></div><div class="adm-body" id="admBody"></div><div class="adm-foot"><span id="admStatus"></span><button type="button" class="ghost" data-a="discard">إلغاء التغييرات</button><button type="button" class="primary" id="admPub" data-a="publish">نشر التغييرات</button></div></div>';
  document.body.appendChild(p);
  p.addEventListener("click",onAdminClick); p.addEventListener("input",onField); p.addEventListener("change",onField);
}
(async function(){
  try{
    if(!window.claude||!claude.use) return;
    const [user,art]=await Promise.all([claude.use("user"),claude.use("artifact")]);
    if(!user||!art) return;
    if(!(await user.canEdit())&&!(await user.isOwner())) return;
    ART=art; mountAdmin();
  }catch(e){}
})();
